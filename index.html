<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>El pollo loco</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="img/3_enemies_chicken/chicken_normal/1_walk/1_w.png">
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/background-objects.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/small-chicken.class.js"></script>
    <script src="models/bottle.js"></script>
    <script src="models/coins.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/statusbar.class.js"></script>
    <script src="models/world.actions.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="levels/level2.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="./js/game.js"></script>
    <script src="./js/templates.js"></script>
</head>

<body onload="">
    <h1>El Pollo Loco</h1>
    <div id="fullscreen" class="game-container">
        <div id="game-result-overlay" class="game-result-overlay overlay-bg d-none"></div>
        <div id="landingscreen" class="landingscreen overlay-bg">
            <button class="wood-btn" onclick="toggleOverlay('game-explanation', getExplanationOverlay)">Explanation</button>
            <button class="wood-btn" onclick="init()">Start Game</button>
            <button class="wood-btn" onclick="toggleOverlay('imprint', getImprintOverlay)">Imprint</button>
        </div>
        <div id="game-btns" class="game-btns d-none">
            <button id="sound-btn" onclick="toggleSoundBtn()" class="toggle-sound-btn" title="Mute"><img src="img/icons/volume_up.svg"></button>
            <button id="exit-game" onclick="exitGame()" class="exit-game-btn"><img src="img/icons/exit.svg" title="Exit"></button>
        </div>

        <canvas id="canvas" width="720" height="480"></canvas>
        <div id="game-information">
            <div id="game-explanation" class="overlay d-none"></div>
            <div id="imprint" class="overlay d-none"></div>
        </div>

        <div id="mobile-btns" class="mobile-btns d-none">
            <div id="btns-left" class="wrapper-btns">
                <div id="move-left-btn" class="btn"><img src="img/icons/arrow_left.svg"></div>
                <div id="move-right-btn" class="btn"><img src="img/icons/arrow_right.svg"></div>
            </div>
            <div id="btns-right" class="wrapper-btns">
                <div id="jump-btn" class="btn"><img src="img/icons/arrow_up.svg"></div>
                <div id="throw-btn" class="btn"><img src="img/icons/throw_icon.svg"></div>
            </div>
        </div>

    </div>


    <div id="portrait-mode" class="fullscreen">
        <img class="mobile-rotate" src="img/icons/mobile_rotate.svg">
        <div class="rotate-text">
            <span>Rotate</span>
            <span>your</span>
            <span>phone</span>
        </div>
        
    </div>
</body>
</html>
